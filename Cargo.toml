[package]
name = "ferropipe"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = "0.36.1"
ferropipe-rdp = { path = "../ferropipe-rdp" }
egui = "0.36.1"
egui_extras = "0.36.1"
pavao = "0.2.16"
rand = "0.8"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh2 = "0.9.6"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "time", "io-util"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
winrm-rs = "1.1.2"
zeroize = "1.9.0"
