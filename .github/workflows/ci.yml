# Ferropipe CI.
#
# The crate depends on two sibling checkouts through path dependencies:
#   ferropipe/Cargo.toml      -> ferropipe-rdp = { path = "../ferropipe-rdp" }
#   ferropipe-rdp/Cargo.toml  -> rdpeudp       = { path = "../rdpeudp" }
# so the job checks the three repositories out side by side under the workspace
# (ferropipe/, ferropipe-rdp/, rdpeudp/) and runs cargo from ferropipe/. Each
# sibling is taken at the branch this run is for when it has one of that name
# (so a feature branch spanning repositories builds against itself), else at
# its default branch. Both siblings must exist on GitHub before this workflow
# can pass; if either is private, put a token with read access into its clone
# URL (`https://x-access-token:${{ secrets.SIBLING_TOKEN }}@github.com/...`).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out ferropipe
        uses: actions/checkout@v4
        with:
          path: ferropipe

      - name: Check out ferropipe-rdp (same branch if it exists, else default)
        env: { BRANCH: "${{ github.head_ref || github.ref_name }}" }
        run: |
          git clone --depth 1 https://github.com/nicatmhmmdv/ferropipe-rdp.git ferropipe-rdp
          git -C ferropipe-rdp fetch --depth 1 origin "$BRANCH" && git -C ferropipe-rdp checkout FETCH_HEAD || echo "ferropipe-rdp: no branch $BRANCH, using default"

      - name: Check out rdpeudp (same branch if it exists, else default)
        env: { BRANCH: "${{ github.head_ref || github.ref_name }}" }
        run: |
          git clone --depth 1 https://github.com/nicatmhmmdv/rdpeudp.git rdpeudp
          git -C rdpeudp fetch --depth 1 origin "$BRANCH" && git -C rdpeudp checkout FETCH_HEAD || echo "rdpeudp: no branch $BRANCH, using default"

      - name: Install native libraries (libssh2, OpenSSL, libsmbclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh2-1-dev libssl-dev libsmbclient-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferropipe

      - name: cargo build
        working-directory: ferropipe
        run: cargo build --locked

      # No --all-features: the only optional feature, `bundled-fonts`, embeds
      # IBM Plex TTFs that are not in the repository (see assets/fonts/README.md),
      # so building it here would fail on the missing files.
      - name: cargo test
        working-directory: ferropipe
        run: cargo test --locked

      - name: cargo clippy
        working-directory: ferropipe
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo fmt
        working-directory: ferropipe
        run: cargo fmt --check

  # Advisory only: a new RustSec advisory should not block a merge, but it
  # should be visible on the run.
  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # cargo-audit only reads Cargo.lock, so the siblings are not needed and
      # the repository can sit at the workspace root, where the action looks.
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
